Done=Terminé
NameHelp=Saisissez un nom, puis appuyez sur Entrée. Échap pour annuler.
EditorHelp=Haut/Bas : choisir   Start : renommer/modifier la couleur   Back : liste des palettes
ColorHelp=Haut/Bas : canal RGB   Gauche/Droite : ajuster   Start/Back : terminer
DeleteTitle=SUPPRIMER LA PALETTE ?
Cancel=Annuler
Delete=Supprimer
Deleted=Palette supprimée.

; ============================================================
; Options Help — Select Music submenu
; ============================================================
[OptionsSelectMusicHelp]
ShowBannersHelp=Afficher les bannières des chansons/packs ou forcer des bannières de couleur de remplacement.
ShowVideoBannersHelp=Animer les bannières MP4 une fois la sélection stabilisée.\nSi Non, les bannières vidéo affichent uniquement l'image d'aperçu en cache.
ShowBreakdownHelp=Afficher ou masquer le panneau de breakdown des streams dans le choix de la musique.
BreakdownStyleHelp=Choisir le format de breakdown affiché dans le choix de la musique.\nSL utilise le format de breakdown de Simply Love.\nSN utilise le format de breakdown de Stamina Nation.
ShowNativeLanguageHelp=Choisir comment les titres sont affichés sur la roue.\nTranslittéré utilise les balises translittérées si elles existent ; Original utilise les balises d'origine.
MusicWheelSpeedHelp=Définir la vitesse de défilement maintenu de la roue musicale.\nCorrespondance : Lente=5, Normale=10, Rapide=15, Plus rapide=25, Ridicule=30, Délirante=45, Plaid=100.
MusicWheelStyleHelp=Choisir comment les packs ouverts apparaissent sur la roue.\nITG garde les en-têtes des autres packs visibles pendant l'affichage des chansons du pack actif.\nIIDX masque tous les autres packs et ne garde visible que l'en-tête du pack actif.
DifficultyColorsHelp=Modifier le jeu de couleurs des difficultés indépendamment de la couleur de thème choisie.\nSimply Love suit la couleur du thème actif. ITG et DDR utilisent leurs couleurs d'arcade fixes.
HideInactiveSeriesHelp=Masquer les dossiers de séries parentes inactives lors de la navigation dans une série ou un pack ouvert.\nCe réglage s'applique aux styles de roue ITG et IIDX.
DefaultSortHelp=Choisir le tri utilisé au début d'une nouvelle session de choix de la musique.\nDernier utilisé mémorise d'une session à l'autre le dernier tri standard choisi dans le menu Tris de la roue.
SeriesSourceHelp=Choisir d'où proviennent les noms de séries.\npack.ini utilise les métadonnées [Group] Series de chaque pack.\nDossier utilise exactement un niveau de dossier supplémentaire : Songs/Série/Pack/Chanson.
SongSelectBGHelp=Choisir une image à afficher en arrière-plan de chaque élément de la roue.\nDésactivé la supprime. Bannière privilégie les bannières de chansons, puis les arrière-plans. BG privilégie les arrière-plans de chansons, puis les bannières.
SwitchProfileHelp=Afficher Changer de profil dans le menu de tri du choix de la musique.
ShowCdTitlesHelp=Afficher ou masquer les CDTitles dans le choix de la musique.
ShowWheelGradesHelp=Afficher ou masquer les notes sur les lignes de la roue.
ShowWheelLampsHelp=Afficher ou masquer les lampes sur les lignes de la roue.
ITLRankHelp=Choisir quel rang ITL basé sur les classements apparaît sur les lignes de la roue.\nAucun masque le rang.\nChart affiche votre position au classement ITL de ce chart.\nGlobal affiche le rang façon zmod de ce chart parmi vos charts ITL, selon les points issus du tournoi avec la même séparation single/double.
WheelScoresHelp=Afficher les pourcentages de score pour aucune chanson, les chansons d'événement uniquement, ou toutes les chansons.\nITL utilise l'EX ; Stamina RPG utilise les scores ITG normaux. Les notes et lampes ont leurs propres réglages.
WheelScoreTypeHelp=Choisir le pourcentage de score pour les chansons hors ITL et Stamina RPG.\nNormal utilise le score ITG ; EX et HEX utilisent leurs systèmes de score respectifs.
WheelShowFailsHelp=En l'absence de score réussi, afficher en rouge le meilleur score local en échec.\nLes scores réussis sont toujours prioritaires. Les scores en échec en ligne ne sont jamais affichés.
WheelItlPointsHelp=Afficher les points d'événement au-dessus des scores ITL réussis.\nLes points sont masqués pour les scores en échec et lorsque deux joueurs ont rejoint.
NewPackBadgeHelp=Afficher NOUVEAU sur les en-têtes de packs en tri par groupe.\nOuvrir le pack retire le badge lorsque vous ouvrez ce pack.\nA un score affiche NOUVEAU tant qu'aucune chanson du pack n'a de score local ou importé en cache pour un joueur présent.\nDésactivé supprime le badge et considère les packs nouvellement détectés comme vus.
FolderStatsHelp=Afficher les statistiques de réussite du dossier dans une fenêtre en haut à droite du choix de la musique.\nCompte les charts correspondants du pack choisi pour la difficulté actuelle à partir des scores locaux, GrooveStats et ArrowCloud en cache.
ShowPatternInfoHelp=Choisir si le panneau inférieur d'infos du chart privilégie Tech, Endurance ou une détection Auto.\nRecommandé : Tech.
StepArtistBoxHelp=Choisir la disposition de l'encadré du step artist dans le choix de la musique.\nPar défaut suit le thème actif. Classique reprend le petit encadré sur une ligne de Simply Love. Étendu reprend le grand encadré multiligne pour un joueur d'Arrow Cloud.
ChartInfoHelp=Choisir quelle donnée du chart apparaît au-dessus du breakdown.\nUtilisez Gauche/Droite pour choisir NPS max, eBPM max ou Matrix Rating, puis Start pour activer chaque option.\nAu moins une donnée reste toujours activée.
MusicPreviewsHelp=Activer ou désactiver les aperçus audio du choix de la musique.
PreviewMarkerHelp=Afficher une ligne blanche sur le graphique de densité à la position actuelle de l'aperçu.\nApparaît uniquement pendant la lecture des aperçus.
LoopMusicHelp=Choisir si les aperçus tournent en boucle ou sont lus une fois.
PreviewStartsImmediatelyHelp=Choisir si les aperçus musicaux démarrent dès l'arrivée sur le choix de la musique, ou seulement après le premier mouvement de la roue.
ShowGameplayTimerHelp=Afficher le chrono de session de jeu dans le choix de la musique.
ShowStageDisplayHelp=Afficher le numéro de la chanson actuelle sous l'en-tête du choix de la musique.
ShowGsBoxHelp=Afficher l'encadré GS dans les zones panneau/scores du choix de la musique lorsqu'il est disponible.\nL'encadré GS ne s'affiche que si GrooveStats/BoogieStats/ArrowCloud est activé et connecté.
GsBoxPlacementHelp=Auto conserve les règles de placement actuelles.\nPanneau des pas ancre toujours l'encadré GS sur le panneau des pas lorsqu'il est affiché.
GsBoxLeaderboardsHelp=Choisir les classements que l'encadré GS fait défiler.\nUtilisez Gauche/Droite pour choisir ITG/EX/H.EX/Tournois, puis Start pour activer chaque option.

; ============================================================
; Options Help — Advanced submenu
; ============================================================
[OptionsAdvancedHelp]
DefaultFailTypeHelp=Choisir le comportement d'échec de la machine lorsque la vie tombe à zéro.\nImmediate : passe à l'évaluation dès que tous les joueurs présents échouent.\nImmediateContinue : continuer à jouer jusqu'à la fin de la chanson après l'échec.\nPar défaut : ImmediateContinue (recommandé).
BannerCacheHelp=Activer ou désactiver le cache disque des bannières de la roue.\nPar défaut : Activé (BannerCache=1).
CdTitleCacheHelp=Activer ou désactiver le cache disque des textures brutes des CDTitles.\nPar défaut : Activé (CDTitleCache=1).
SongParsingThreadsHelp=Définir le nombre de threads pour l'analyse des simfiles au démarrage.\nPar défaut : Auto (SongParsingThreads=0).
CacheSongsHelp=Activer ou désactiver l'écriture/l'utilisation des métadonnées de chansons en cache.\nPar défaut : Activé (CacheSongs=1).
FastLoadHelp=Activer des raccourcis de démarrage qui réduisent les chargements bloquants.\nPar défaut : Activé (FastLoad=1).
AllowSongDeletionHelp=Permettre aux joueurs de supprimer définitivement des chansons de l'ordinateur en appuyant sur Ctrl + Retour arrière sur la roue musicale.\nPar défaut : Désactivé (AllowSongDeletion=0).

; ============================================================
; Options Help — Course submenu
; ============================================================
[OptionsCourseHelp]
ShowRandomCoursesHelp=Afficher ou masquer les parcours contenant des chansons aléatoires (ex. RANDOM/group/*).
ShowMostPlayedHelp=Afficher ou masquer les parcours contenant des choix par tri MostPlayed/BEST.
ShowIndividualScoresHelp=Si Non, les pages de score par chanson d'un parcours sont masquées à l'évaluation et en fin de partie.
AutosubmitIndividualHelp=Envoyer chaque chart du parcours aux services en ligne activés comme un score distinct. Chaque chart est évalué avec sa propre barre de vie, qui démarre à 50 %.
AutosubmitPostFailPassesHelp=Envoyer les chansons suivantes du parcours que le joueur réussit avec une barre de vie indépendante, même après avoir échoué le parcours. Le parcours lui-même reste en échec.

; ============================================================
; Options Help — GrooveStats / ArrowCloud submenu
; ============================================================
[OptionsGrooveStatsHelp]
EnableGrooveStatsHelp=Activer la connexion aux services GrooveStats.
ShowSRPGShopHelp=Afficher la boutique SRPG10 dans le menu de tri du choix de la musique.\nNécessite un nom d'utilisateur et un mot de passe dans le fichier groovestats.ini du profil actif.
SRPGShopFolderHelp=Choisir où les chansons SRPG10 achetées sont installées.\nFaction spécifique crée des packs FE, DPRT, SN et NEP séparés. Cette option est masquée si « Afficher la boutique SRPG » est sur Non.
EnableBoogieStatsHelp=Faire pointer les URL des services GrooveStats vers BoogieStats.\nNécessite que GrooveStats soit activé.
AutoPopulateScoresHelp=Importer la note/la lampe/le score GS lorsque les requêtes de classement de l'encadré des scores aboutissent.
AutoDownloadUnlocksHelp=Télécharger automatiquement les packs de déblocage renvoyés par les envois d'événements GrooveStats.\nActive l'écran Voir les téléchargements du menu de tri lorsque le service est connecté.
SeparateUnlocksByPlayerHelp=Télécharger les packs de déblocage dans des dossiers par joueur plutôt que dans un dossier d'événement commun.\nCorrespond à la préférence SeparateUnlocksByPlayer de Simply Love.
EnableArrowCloudHelp=Activer la connexion aux services ArrowCloud.
ArrowCloudSubmitFailsHelp=Si Oui, les chansons échouées sont tout de même envoyées à ArrowCloud.\nPar défaut : Non.
ArrowCloudResultDialogsHelp=Télécharger et afficher les fenêtres de résultats renvoyées après un envoi réussi à ArrowCloud.\nUtilisez Gauche/Droite pour changer de page et Start/Back pour fermer. Select fait toujours une capture d'écran.\nPar défaut : Oui.
ArrowCloudQRLoginHelp=Quand afficher l'écran de connexion par QR ArrowCloud après le choix d'un profil.\n\nToujours : toujours l'afficher.\nParfois : uniquement si un joueur présent n'a pas de clé API enregistrée.\nJamais : ne jamais l'afficher automatiquement. Vous pouvez toujours lier un profil manuellement depuis Gérer les profils locaux.
GrooveStatsQRLoginHelp=Quand afficher l'écran de connexion par QR GrooveStats après le choix d'un profil.\n\nToujours : toujours l'afficher.\nParfois : uniquement si un joueur présent n'a pas de clé API enregistrée.\nJamais : ne jamais l'afficher automatiquement. Vous pouvez toujours lier un profil manuellement depuis Gérer les profils locaux.

; ============================================================
; Options Help — Online Scoring submenu
; ============================================================
[OptionsOnlineScoringHelp]
GsBsOptionsHelp=Ouvrir les réglages GrooveStats / BoogieStats.
ArrowCloudOptionsHelp=Ouvrir les réglages ArrowCloud.
ScoreImportHelp=Ouvrir les outils d'importation des scores et le choix du point d'accès/profil.
ShareRipsHelp=Si Oui, les booster packs extraits via Rip Packs dans Trouver du contenu sont listés parmi les rips récents d'itgcontent.net, et marqués comme conservés lorsque vous les gardez.\nSeul le rip lui-même est envoyé : ce qu'il demandait et les chansons trouvées. Rien sur vous ou vos profils n'est envoyé.\nPar défaut : Oui.
NullOrDieOptionsHelp=Ouvrir les réglages d'affichage et de confiance de l'analyse null-or-die.
SyncPacksHelp=Ouvrir les outils de synchro en masse pour tous les fichiers ou un pack installé précis.\nUne fenêtre de revue locale s'ouvre ici après le choix d'une cible.

; ============================================================
; Options Help — Null-or-Die submenu
; ============================================================
[OptionsNullOrDieHelp]
SyncGraphHelp=Choisir le graphique null-or-die affiché par la fenêtre de synchro du choix de la musique.\nFréquence : accumulateur spectral pondéré.\nIndex des temps : digest par temps au fil du morceau.\nEmpreinte post-noyau : carte de chaleur de convolution avec la réponse finale du noyau.
GraphOrientationHelp=Choisir l'axe utilisé pour les lignes du graphique null-or-die.\nVerticale garde la fréquence ou l'index des temps sur l'axe vertical.\nHorizontale le bascule sur l'axe horizontal.
GraphOriginHelp=Choisir où apparaît le début de la chanson dans les graphiques null-or-die verticaux.\nBas correspond au comportement natif de nine-or-null et est la valeur par défaut.
SyncConfidenceHelp=Définir la confiance minimale requise pour enregistrer une synchro de pack.\nLes charts en dessous de cette valeur sont analysés et affichés, mais ignorés lors de l'enregistrement d'un pack.\nLa synchro d'une seule chanson permet toujours d'enregistrer sous le seuil et affiche un avertissement à la place.
CacheResultsHelp=Réutiliser les analyses null-or-die terminées et les conserver d'une session à l'autre.\nSi désactivé, chaque synchro de chanson ou de pack est réanalysée et les nouveaux résultats ne sont pas mis en cache.\nPar défaut : Oui (NullOrDieCacheResults=1).
PackSyncThreadsHelp=Définir le nombre de threads utilisés pour l'analyse null-or-die de synchro de pack/de tout.\nAuto utilise tous les cœurs logiques ; 1 garde l'analyse sur un seul thread.\nPar défaut : Auto (PackSyncThreads=0).
FingerprintHelp=Définir la largeur d'empreinte utilisée autour de chaque temps pendant l'analyse du biais.\nLes petites valeurs se concentrent plus étroitement sur chaque temps ; les grandes comparent une fenêtre plus large.
WindowHelp=Définir la taille de la fenêtre du spectrogramme en millisecondes.\nCela modifie la quantité d'audio analysée par tranche FFT.
StepHelp=Définir le pas du spectrogramme en millisecondes.\nLes petites valeurs échantillonnent plus finement et peuvent augmenter le coût de l'analyse.
MagicOffsetHelp=Ajouter un décalage fixe au biais final estimé.\nUtile pour tester d'autres hypothèses de parité sans modifier les simfiles.
KernelTargetHelp=Choisir si le noyau opère sur les données digest ou accumulateur.\nDigest correspond à la valeur par défaut actuelle.
KernelTypeHelp=Choisir la forme du noyau utilisée pour la convolution de post-traitement.\nMontant correspond à la valeur par défaut actuelle.
FullSpectrogramHelp=Autoriser l'empreinte sur spectrogramme complet lorsque null-or-die le juge approprié.\nCela peut demander plus de mémoire ou de calcul pour certains charts.

