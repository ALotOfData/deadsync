[OptionsMachineHelp]
SelectProfileHelp=Afficher ou passer le choix du profil au démarrage.
SelectColorHelp=Afficher ou passer le choix de la couleur au démarrage.
PreferredColorHelp=Appliquée lorsque le choix de la couleur est désactivé.
SelectStyleHelp=Afficher ou passer le choix du style au démarrage.
PreferredStyleHelp=Appliqué lorsque le choix du style est désactivé.
SelectPlayModeHelp=Afficher ou passer le choix du mode de jeu au démarrage.
PreferredModeHelp=Appliqué lorsque le choix du mode de jeu est désactivé.
MachineFontHelp=Choisir la famille de polices de la machine. Wendy est la police par défaut ; Mega remplace les en-têtes et les chiffres par la police Mega.
BarColorHelp=Choisir le style d'arrière-plan des barres d'écran. Par défaut suit le style visuel choisi : Technique utilise des barres transparentes, SRPG9 des barres colorées, et les autres styles conservent le comportement actuel de l'écran.
EvaluationStyleHelp=Choisir l'opacité des cadres de l'évaluation. Par défaut suit le style visuel choisi : Technique utilise des cadres transparents et les autres styles des cadres opaques.
EvalSummaryHelp=Afficher ou passer le récapitulatif d'évaluation après avoir quitté le choix des chansons/parcours.
EasterEggsHelp=Activer les surprises cachées de l'évaluation de Simply Love, dont les animations « You Tried » pour les flags Great et Excellent. L'easter egg « Nice » se règle séparément.
NiceSoundHelp=Afficher et jouer l'easter egg « nice » sur l'évaluation lorsqu'un score contient 69.
NameEntryHelp=Afficher ou passer la saisie du nom après le récapitulatif d'évaluation.
GameoverScreenHelp=Afficher ou passer l'écran Game Over après la saisie du nom.
WriteCurrentScreenHelp=Écrire le nom de l'écran actif dans save/current_screen.txt à chaque transition.
MenuMusicHelp=Jouer ou couper la musique de menu en boucle sur le choix de la couleur/du style/du mode de jeu.
VisualStyleHelp=Choisir le style visuel Simply Love utilisé par les écrans de menu et l'illustration du choix de la couleur.
ThemeVariantHelp=Choisir le thème Stamina utilisé lorsque l'icône de muscle est sélectionnée : SRPG9, SRPG10 ou ECS15.
ReplaysHelp=Activer l'enregistrement local des replays pendant le jeu.\nLorsque cette option est désactivée, le choix de la musique masque l'option Lire le replay.
HeartRateMonitorsHelp=Activer la détection des cardiofréquencemètres Bluetooth et le choix d'un appareil par joueur dans les Options du joueur.
PerPlayerGlobalOffsetsHelp=Permettre à chaque profil de joueur d'ajouter un ajustement de timing personnel dans les Options du joueur.\nCet ajustement s'ajoute au décalage global de la machine.
PackIniOffsetsHelp=Appliquer les valeurs SyncOffset de Pack.ini au timing du jeu.\nLorsque cette option est désactivée, les données de synchro de Pack.ini sont ignorées.
DefaultSyncOffsetHelp=Choisir le décalage de synchro à supposer pour les packs sans valeur SyncOffset dans Pack.ini.
KeyboardFeaturesHelp=Activer les raccourcis réservés au clavier, comme Ctrl+R pour recommencer en jeu et à l'évaluation.
VideoBgsHelp=Animer les vidéos d'arrière-plan en jeu.\nLorsque cette option est désactivée, les arrière-plans vidéo affichent la première image à la place.
RandomMoviesHelp=Choisir si le jeu peut utiliser des vidéos aléatoires du dossier RandomMovies lorsque la chanson n'a pas de changements d'arrière-plan scriptés ou demande -random-.
VersionOverlayHelp=Afficher la version en cours sous forme de petit filigrane dans le coin inférieur de chaque écran.\nPratique pour que chaque capture d'écran ou enregistrement indique la version, mais désactivable si vous préférez ne pas le voir.
VersionOverlaySideHelp=Coin de l'écran auquel le filigrane de version est ancré. Sans effet lorsque l'affichage de la version est désactivé.
ShowLocalIpHelp=Afficher l'adresse réseau locale préférée de cette machine en haut à gauche du menu principal.

; ============================================================
; Options Help — Gameplay submenu
; ============================================================
[OptionsGameplayHelp]
BgBrightnessHelp=Régler la luminosité de l'arrière-plan pendant le jeu.
CenteredP1NotefieldHelp=Centrer le notefield actif en mode un joueur pendant le jeu.
NoteScrollClockHelp=Choisir l'horloge, purement visuelle, utilisée pour positionner les notes qui défilent.\nAudio brut utilise directement la position issue de l'audio.\nStable par image avance de façon fluide entre les images et se recale doucement sur le temps audio pour réduire les micro-saccades des notes.\nLes jugements, le score, les replays et le timing des entrées utilisent toujours le temps audio brut.
AnimatedBannersHelp=Gère les bannières vidéo affichées dans les statistiques de pas en jeu.\nStatique affiche l'image d'aperçu en cache. Lire une fois s'arrête sur la dernière image. En boucle répète jusqu'à la fin de la partie.
ZmodRatingBoxHelp=Afficher le libellé de difficulté façon zmod avec l'encadré de niveau en jeu/à l'évaluation.
BpmDecimalHelp=Afficher jusqu'à trois décimales pour le BPM en direct lorsqu'il n'est pas entier.
BpmPositionHelp=Choisir où le BPM en direct est affiché. Près du notefield le place à côté du notefield actif en mode un joueur.
DelayedBackHelp=Choisir comment le bouton BACK quitte une chanson.\nMaintenir : il faut maintenir BACK pendant ~1 seconde (par défaut, comme ITGmania).\nImmédiat : BACK quitte la chanson dès le premier appui.
AutoScreenshotHelp=Faire automatiquement une capture de l'écran d'évaluation.\nUtilisez Gauche/Droite pour choisir une condition, puis Start pour l'activer.\nPBs : records personnels. Fails : scores en échec.\nClears : réussites hors record. Quads : 100 %. Quints : EX parfait.
DefaultJudgmentPaletteHelp=Choisir la palette de couleurs de jugements de la machine, utilisée par les profils réglés sur « Par défaut de la machine ».
ManageJudgmentPalettesHelp=Créer, renommer, modifier ou supprimer des palettes de couleurs de jugements personnalisées.\nLa palette Simply Love intégrée reste en lecture seule.

[OptionsTournamentHelp]
EnableTournamentModeHelp=Activer les règles de tournoi Simply Love sans modifier les options de joueur enregistrées.
ScoringSystemHelp=Choisir le score affiché en jeu et à l'évaluation. EX utilise le score EX de Simply Love ; ITG utilise le pourcentage ITG traditionnel.
StepStatsHelp=Forcer l'affichage ou le masquage des statistiques de pas en jeu pour tous les joueurs.
EnforceNoCmodHelp=Sur les chansons marquées « no cmod », convertir les CMods en MMods équivalents pour cette partie. Les speed mods enregistrés des joueurs ne sont pas modifiés.

[JudgmentPalettes]
Title=PALETTES DE JUGEMENTS
Create=+ Créer une nouvelle palette
Default=Par défaut
BuiltIn=Intégrée
BuiltInReadOnly=Les palettes intégrées sont en lecture seule. Appuyez sur Start pour créer une copie modifiable.
BrowserHelp=Haut/Bas : choisir   Start : modifier ou copier   Select : supprimer (perso)   Back : fermer
