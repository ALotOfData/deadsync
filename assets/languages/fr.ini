[OptionsFoldersHelp]
DataDirHelp=Dossier racine des données utilisateur (configuration, sauvegardes, chansons, parcours, journal). À sauvegarder pour conserver vos réglages.
CacheDirHelp=Cache régénérable (chansons analysées, bannières, téléchargements). Peut être supprimé sans risque ; il sera recréé au prochain lancement.
SongsHelp=Dossier d'analyse des chansons par défaut. Déposez-y des packs de chansons pour les rendre visibles dans DeadSync.
CoursesHelp=Dossier d'analyse des parcours par défaut. Déposez-y des fichiers de parcours pour les rendre visibles dans DeadSync.
ProfilesHelp=Profils par joueur : scores, réglages et identifiants GrooveStats.
ScreenshotsHelp=Captures d'écran enregistrées pendant le jeu.
LogFileHelp=deadsync.log - utile pour signaler des bugs. Choisir cette ligne affiche le fichier dans son dossier parent.
ConfigFileHelp=deadsync.ini - fichier de configuration principal. Choisir cette ligne affiche le fichier dans son dossier parent.

