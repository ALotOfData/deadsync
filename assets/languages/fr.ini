AverageErrorBarIntervalHelp=Définir combien de millisecondes récentes sont moyennées pour le repère de la barre d'erreur moyenne.
ErrorBarTrimHelp=Définir la pire fenêtre de timing affichée par la barre d'erreur.
ErrorBarOptionsHelp=Régler l'emplacement de la barre d'erreur et l'affichage de plusieurs repères.
