; ============================================================
[OptionsSystemHelp]
GameHelp=Choisir le jeu actif : dance utilise des charts à 4 panneaux et pump des charts à 5 panneaux.
ThemeHelp=Enregistré dans deadsync.ini pour compatibilité ; le changement de thème n'est pas encore implémenté.
LanguageHelp=Enregistré dans deadsync.ini pour compatibilité ; le changement de langue en cours d'exécution n'est pas encore implémenté.
LogLevelHelp=Définir le niveau de détail du journal de l'application.\nS'applique immédiatement et est enregistré dans deadsync.ini.
LogFileHelp=Copier les journaux de l'application dans deadsync.log, dans le dossier racine du jeu.\nDésactivé conserve les journaux uniquement dans la ligne de commande.
DefaultScrollSpeedHelp=Choisir la vitesse de défilement par défaut de la machine, utilisée par les invités et les nouveaux profils.
DefaultScrollDirectionHelp=Choisir le sens de défilement par défaut de la machine, utilisé par les invités et les nouveaux profils.
DefaultBackgroundFilterHelp=Choisir le filtre d'arrière-plan par défaut de la machine, utilisé par les invités et les nouveaux profils.
DefaultNoteSkinHelp=Choisir le noteskin par défaut de la machine, utilisé par les invités et les nouveaux profils.\nDes réglages avancés pour les invités et nouveaux profils peuvent être définis séparément dans save/default_player_options.ini.

; ============================================================
; Options Help — Graphics submenu
; ============================================================
[OptionsGraphicsHelp]
VideoRendererHelp=Choisir le moteur de rendu.
SoftwareRendererThreadsHelp=Visible uniquement si le moteur de rendu est Logiciel.\nDéfinir combien de threads CPU le rendu logiciel peut utiliser.
DisplayModeHelp=Choisir la façon dont la fenêtre est affichée à l'écran.
DisplayAspectRatioHelp=Définir le format d'image utilisé pour le rendu.
DisplayResolutionHelp=Choisir une résolution de rendu.
RefreshRateHelp=Choisir une fréquence de rafraîchissement cible.
FullscreenTypeHelp=Choisir entre plein écran exclusif ou sans bordure.
PresentModeHelp=Détermine quand les images rendues sont affichées.\n\nVSync : synchronise les images sur le rafraîchissement de l'écran, évitant le tearing mais ajoutant de la latence.\nMailbox : affiche la dernière image terminée à chaque rafraîchissement, avec moins de latence. Recommandé.\nImmédiat : affiche les images sans attendre le rafraîchissement, minimisant la latence mais provoquant du tearing/ghosting sauf si le jeu tourne autour de ~1000 FPS.
MaxFpsHelp=Active une limite de fréquence d'images en mode Mailbox ou Immédiat. Limiter les FPS réduit la charge GPU inutile et peut éviter le sifflement des bobines, la surchauffe et les ventilateurs bruyants. Non laisse les FPS illimités.
MaxFpsValueHelp=Définit la limite de fréquence d'images. Pour un jeu fluide et sans saccades, commencez vers 3× la fréquence de votre écran — par exemple 180 FPS pour 60 Hz ou 432 FPS pour 144 Hz.\nS'ajuste par pas de 1 FPS. Maintenez gauche ou droite pour aller plus vite.
ShowStatsHelp=Choisir le mode de la superposition de performances : Désactivé, FPS seuls, FPS avec liste des saccades, ou FPS+Saccades+Timing.\nLe mode Timing ajoute des détails sur la prédiction de présentation, les replis, la pression de la file et les domaines d'horloge.
ValidationLayersHelp=Activer les couches de validation Vulkan/D3D/OpenGL pour le débogage graphique.\nRecommandé : Désactivé (les FPS chutent de moitié, mais utile pour le débogage).
HighDPIHelp=Activer les framebuffers OpenGL haute densité/Retina natifs sur macOS.\nAttention : cela augmente fortement le nombre de pixels qu'OpenGL doit dessiner sur les écrans Retina et peut provoquer de fortes chutes de FPS dans les menus ou lors des flashs plein écran.\nRecommandé : Désactivé.
HideMouseCursorHelp=Masquer le curseur de la souris lorsqu'il se trouve dans la fenêtre de DeadSync.
VisualDelayHelp=Appliquer un décalage visuel par pas de 1 ms.
OverscanAdjustmentHelp=Régler le centrage et l'échelle de l'image rendue pour\ncompenser le surbalayage de la TV/de l'écran.

; ============================================================
; Options Help — Sound submenu
; ============================================================
[OptionsSoundHelp]
SoundDeviceHelp=Choisir un périphérique de sortie détecté au démarrage.\nAuto utilise le périphérique de sortie par défaut du système.\nSous Windows, la lecture privilégie WASAPI natif.\nSous macOS, la lecture privilégie CoreAudio natif.\nSous FreeBSD, la lecture privilégie PCM/OSS natif.\nSous Linux, le routage dépend du pilote audio Linux ; le routage ALSA exclusif se configure séparément.\nLa modification prend effet au prochain lancement.
AudioOutputModeHelp=Choisir si la sortie audio utilise le mode Auto ou Partagé.\nAuto conserve la politique par défaut du pilote.\nPartagé force la sortie en mode partagé lorsque c'est possible.\nLe mode exclusif est proposé séparément lorsque le pilote audio Linux est ALSA.\nLa modification prend effet au prochain lancement.
AudioOutputModeWindowsHelp=Auto et Partagé utilisent la sortie en mode partagé.\nExclusif donne à DeadSync l'accès exclusif au périphérique audio choisi.\nLa modification prend effet au prochain lancement.
LinuxAudioBackendHelp=Choisir le pilote Linux à privilégier.\nLes pilotes proposés dépendent de ce qu'inclut cette version.\nAuto privilégie PulseAudio, puis ALSA, puis JACK si nécessaire.\nPipeWire doit être choisi explicitement.\nPipeWire et PulseAudio sont des pilotes à sortie partagée et ignorent actuellement le choix explicite du périphérique audio.\nJACK est un pilote à faible latence et ignore actuellement le choix explicite du périphérique audio.\nALSA est le pilote Linux direct et affiche la ligne Mode exclusif.\nLa modification prend effet au prochain lancement.
AlsaExclusiveHelp=Demander une sortie ALSA exclusive pour le périphérique choisi.\nDésactivé garde ALSA sur le chemin partagé habituel.\nActivé nécessite un périphérique hw/plughw direct ou un alias matériel résolvable.\nLa modification prend effet au prochain lancement.
AudioSampleRateHelp=Choisir une fréquence d'échantillonnage de sortie pour le périphérique audio choisi.
MasterVolumeHelp=Définir le volume général de tout l'audio.
SfxVolumeHelp=Définir le volume des effets sonores avant application du volume principal.
AssistTickVolumeHelp=Définir le volume de l'Assist Tick en jeu avant application du volume principal.
MusicVolumeHelp=Définir le volume de la musique avant application du volume principal.
MineSoundsHelp=Jouer un son lorsqu'une mine est touchée.
GlobalOffsetHelp=Appliquer un décalage audio global par pas de 1 ms.
RateModPreservesPitchHelp=Conserver la hauteur du son lorsque les rate mods sont actifs.
ReplayGainHelp=Expérimental : normalise le volume de lecture entre les chansons avec ReplayGain 2.0 / EBU R 128. Lorsqu'il est activé, le volume de chaque chanson est analysé une seule fois et mis en cache sur le disque : les chansons nouvelles ou modifiées sont analysées automatiquement au démarrage et à chaque rechargement, et la lecture utilise le gain en cache. Pour analyser toute votre bibliothèque immédiatement sans attendre un rechargement, utilisez Appliquer ReplayGain ci-dessous.
ApplyReplayGainHelp=Analyser dès maintenant le volume ReplayGain de chaque chanson de votre bibliothèque, au lieu d'attendre le prochain démarrage ou rechargement. Affiche la progression avec une estimation du temps restant et peut être annulé à tout moment. Les chansons déjà analysées sont ignorées, donc relancer l'opération est rapide.

; ============================================================
; Options Help — Input submenu
; ============================================================
[OptionsInputHelp]
ConfigureMappingsHelp=Associer les touches du clavier, les panneaux, les boutons de menu, etc. aux fonctions du jeu.
TestInputHelp=Tester votre tapis de danse/contrôleur et vos boutons de menu.\n\nSi l'un de vos boutons n'est associé à aucune fonction du jeu, il apparaîtra ici comme « non assigné ».
ConfigurePadsHelp=Afficher et modifier les seuils des capteurs des pads connectés (StepManiaX, etc.). Les pads sont affichés côte à côte ; Gauche/Droite choisit un panneau, Haut/Bas règle son seuil. Les modifications sont écrites directement sur le pad.\nSi « DeadSync gère la config des pads » est activé, DeadSync écrasera ces modifications (au lancement, ou lorsque le profil actif ou le pad change) ; enregistrez plutôt vos réglages en tant que profils depuis le choix de la musique. Si l'option est désactivée, vos modifications restent sur le pad.
InputOptionsHelp=Ouvrir des réglages de contrôle supplémentaires.
GamepadBackendHelp=Choisir le pilote d'entrée des manettes. Sous Windows, Raw Input est le choix par défaut et WGI reste disponible comme solution de compatibilité.\nChanger de pilote nécessite un redémarrage.
SmxInputHelp=Activer l'entrée native des scènes StepManiaX via le SDK RustManiaX, en se connectant directement aux pads.\nCette modification nécessite un redémarrage.\nPar défaut : Non.
UseFSRsHelp=Activer les diagnostics FSR directs et la modification des seuils sur l'écran Configurer les pads. Lit directement les pads compatibles au lieu de passer par le pilote d'entrée du jeu.\nAffiche aussi la page des réglages StepManiaX.\nPar défaut : Non.
SmxConfigHelp=Réglages des pads StepManiaX : activer l'entrée StepManiaX et la gestion de la config des pads.\nVisible lorsque « Utiliser les FSR » est activé.
SmxManagesPadConfigHelp=Détermine qui contrôle les seuils de vos pads StepManiaX.\nActivé : DeadSync écrit les seuils sur chaque pad (le profil par défaut enregistré du pad, ou le préréglage « Config de pad par défaut » s'il n'en a pas) et les réapplique au lancement et à chaque changement de profil actif ou de pad. Les modifications faites dans Configurer les pads sont temporaires ; enregistrez vos réglages en tant que profils depuis le choix de la musique pour les conserver.\nDésactivé : DeadSync ne modifie jamais vos pads. Modifiez-les directement dans Configurer les pads et les valeurs restent sur le pad.\nPar défaut : Non.
SmxPanelLightsHelp=Piloter les LED des panneaux des pads StepManiaX avec des animations GIF. Joue des animations d'arrière-plan configurables sur tous les écrans, des effets de jugement par panneau pendant le jeu (notes de tap, freezes, rolls, mines touchées) et un retour visuel aux appuis dans les menus. Tant que le jeu affiche quelque chose, l'éclairage du firmware du pad est désactivé ; ce qu'affiche un pad au repos est défini par « Éclairage du pad au repos ».\nPar défaut : Non.
SmxUnderglowThemeHelp=Régler les LED d'éclairage inférieur sur les bords du pad StepManiaX sur la couleur de votre thème. Le pad J1 utilise la couleur choisie ; le pad J2 utilise la couleur décalée associée. Appliqué à la connexion du pad et à chaque changement de couleur du thème. Tant que cette page d'options est ouverte, les bandes affichent une couleur de test rouge (bleue si l'option est désactivée). Nécessite un pad récent avec un firmware de carte mère v4 ou ultérieur ; les pads plus anciens ne gèrent pas l'éclairage inférieur et ne s'allumeront pas.\nPar défaut : Non.
SmxUnderglowGrbHelp=Ordre des octets pour les bandes LED de l'éclairage inférieur. Certaines bandes lisent les couleurs dans l'ordre GRB, ce qui inverse le rouge et le vert : le violet apparaît cyan et le vert magenta. Tant que cette page d'options est ouverte, les bandes affichent une couleur de test rouge ; si elles affichent du vert au lieu du rouge, passez cette option sur GRB.\nPar défaut : RGB.
DefaultPadConfigHelp=Le préréglage de seuils intégré (Bas/Moyen/Haut, identique à l'outil officiel StepManiaX) que DeadSync utilise par défaut.\nPar défaut : Bas.
SmxSinglePadPlayerHelp=Avec un seul pad StepManiaX connecté, choisir s'il joue en tant que Joueur 1 ou Joueur 2, quel que soit son cavalier matériel. Choisissez Joueur 2 pour jouer sur une seule scène du côté J2.
SmxDefaultLightBrightnessHelp=Luminosité par défaut de la machine pour l'éclairage des pads StepManiaX, de 0 % (éteint) à 100 %. Sert de valeur initiale pour les nouveaux profils ; chaque joueur peut ensuite définir sa propre valeur dans les Options du joueur.\nPar défaut : 100 %.
SmxBgPackHelp=Le pack de GIF à utiliser pour les animations d'arrière-plan sur tout le pad. Par défaut utilise le pack commun intégré. Les packs utilisateur vont dans assets/smx-pad-lights/dance/<pack-name>/. Visible uniquement si l'éclairage des panneaux est activé.
SmxJudgePackHelp=Le pack de GIF à utiliser pour les animations de jugement par panneau. Par défaut utilise le pack commun intégré. Les packs utilisateur vont dans assets/smx-judge-lights/dance/<pack-name>/. Visible uniquement si l'éclairage des panneaux est activé.
SmxIdleLightsHelp=Ce qu'affichent les pads lorsque l'éclairage GIF n'a rien à afficher, par exemple avec le pack « none » ou un rôle laissé vide par un pack.\nFirmware : les pads reviennent à leur éclairage intégré (animations de repos et de pas enregistrées).\nNoir : le jeu garde le contrôle des LED et maintient les pads éteints ; les animations d'appui sur les panneaux sont toujours jouées.\nVisible uniquement si l'éclairage des panneaux est activé. Par défaut : Firmware.
SmxAssignPadsHelp=Choisir quel pad physique est le Joueur 1 et lequel est le Joueur 2 en marchant sur chacun. Utile lorsque les deux pads partagent le même cavalier J1/J2, ou lorsqu'ils sont installés du mauvais côté. Les pads s'allument en bleu (J1) et en rouge (J2) pour visualiser l'assignation.
SmxSwapPadsHelp=Inverser instantanément le pad du Joueur 1 et celui du Joueur 2. Pratique lorsque les cavaliers sont corrects mais que les pads sont installés du mauvais côté. Les deux pads doivent être connectés.
DebugFsrDumpHelp=Si vous avez des FSR, utilisez ceci pour créer fsrdump.txt dans votre dossier deadsync. Envoyez-le à PerfectTaste pour qu'il puisse déboguer et ajouter la prise en charge d'autres cartes d'E/S FSR et versions de firmware.
MenuButtonsHelp=Choisir si les boutons de jeu (ex. les flèches directionnelles) peuvent servir à naviguer dans les menus.\nUtiliser les boutons de jeu - Naviguez dans le jeu avec votre tapis de danse.\nBoutons dédiés uniquement - Naviguez dans le jeu avec les boutons de menu dédiés.\nLorsque cette option est activée, certaines actions passent de Select à un appui simultané Gauche+Droite.\n\nBoutons dédiés uniquement nécessite qu'au moins un joueur ait des boutons de menu assignés avant de pouvoir être choisi.
OptionsNavigationHelp=Choisir comment les écrans de type Options du joueur passent d'une ligne à l'autre.\nStyle StepMania - Haut/Bas change de ligne et Start va directement à Quitter.\nStyle arcade - Start passe à la ligne suivante et la ligne active affiche un indicateur fléché vers le bas.
MenuNavigationHelp=Choisir si la navigation dans les menus de type borne attend cinq ou trois boutons par joueur.\nMenu à cinq touches - Utilise MenuLeft, MenuRight, MenuUp, MenuDown et Start.\nMenu à trois touches - Utilise MenuLeft, MenuRight et Start.\nLe menu à cinq touches nécessite MenuUp, MenuDown, MenuLeft et MenuRight pour au moins un joueur.\nLe menu à trois touches nécessite MenuLeft, MenuRight et Start pour au moins un joueur.
DebounceHelp=Fenêtre anti-rebond globale par entrée, utilisée dans les menus et en jeu pour le clavier et tous les pilotes de manette.\nLa valeur par défaut d'ITGmania est 20 ms. 50 ms était courant sur les anciens pads d'arcade.

