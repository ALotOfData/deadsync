[OptionsLights]
Driver=Pilote
GameplayPadLights=Éclairage du pad en jeu
SimplifyBass=Simplifier les lumières basses
TestLights=Tester les lumières

[OptionsLightsHelp]
DriverHelp=Choisir le pilote natif de sortie d'éclairage.\nPar défaut : Aucun.\nUtilisez Snek pour une sortie compatible Snekboard.\nUtilisez Litboard pour la sortie série Litboard/Sextet d'icedragon.io.\nUtilisez Win32Serial pour une sortie série Sextet compatible ITGmania via LightsComPort.\nUtilisez HidBlueDot pour la sortie HID BlueDot.\nUtilisez STAC2 pour la sortie HID STAC2 d'icedragon.io.\nUtilisez MinimaidHID pour la sortie HID Minimaid.
GameplayPadLightsHelp=Choisir le comportement des lumières des panneaux fléchés pendant le jeu.\nEntrée suit le pad/les boutons physiques.\nChart fait clignoter les panneaux selon les flèches du chart, même si personne n'appuie sur le pad.
SimplifyBassHelp=Lorsque cette option est activée, les lumières basses ne clignotent en jeu que sur les lignes du chart à la noire, comme la préférence LightsSimplifyBass d'ITGmania.\nPar défaut : Oui.
TestLightsHelp=Ouvrir le testeur d'éclairage de la borne et des pads.

