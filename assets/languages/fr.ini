; ============================================================
; Options Help — Sync Pack submenu
; ============================================================
[OptionsSyncPackHelp]
SyncPackPackHelp=Choisir les packs installés à inclure dans la synchro.\nTous les packs analyse chaque pack installé ; un pack précis limite l'opération à ce pack.
SyncPackStartHelp=Ouvrir la fenêtre de revue de synchro locale pour le filtre de pack choisi.\nUtilisez Tous les packs pour analyser chaque pack installé en une seule passe.

; ============================================================
; Options Help — Score Import submenu
; ============================================================
[OptionsScoreImportHelp]
ScoreImportEndpointHelp=Choisir le point d'accès source depuis lequel importer les scores.\nGrooveStats, BoogieStats ou ArrowCloud.
ScoreImportProfileHelp=Choisir un profil local disposant d'identifiants configurés pour ce point d'accès.\nGS/BS nécessitent une clé API + un nom d'utilisateur dans groovestats.ini.\nAC nécessite une clé API dans arrowcloud.ini.
ScoreImportPackHelp=Choisir le pack installé à inclure dans l'importation des scores.\nUtilisez Tous pour importer sur tous les packs installés.
ScoreImportOnlyMissingHelp=Si Oui, importer uniquement les charts qui n'ont pas encore de score en cache pour le service choisi.\nSi Non, demander chaque hash de chart sélectionné.
ScoreImportStartHelp=Importe en masse les scores de ce profil pour le point d'accès et le filtre de pack choisis.\nLimité strictement à 3 requêtes/s pour éviter de surcharger l'API.\nPour de nombreux charts, cela peut prendre plus d'une heure.

