[OptionsHelp]
ArcadeOptionsHelp=Configurer le mode jeton, les crédits, le nombre de chansons par partie et le jeu Premium Free chronométré.
BookkeepingHelp=Afficher les compteurs cumulés de jetons et de parties de cette machine.
SystemOptionsHelp=Régler les paramètres généraux comme le type de jeu, le thème, la langue, etc.
GraphicsOptionsHelp=Modifier le format d'image, la résolution, la qualité graphique et les visuels de synchronisation.
SoundOptionsHelp=Régler la sortie audio et les sons de retour.
InputOptionsHelp=Configurer l'assignation des commandes et les diagnostics de contrôle.
LightsOptionsHelp=Configurer la sortie d'éclairage de la borne et des contrôleurs.
MachineOptionsHelp=Choisir les écrans affichés au démarrage et après une session.
GameplayOptionsHelp=Régler les paramètres de présentation du jeu.
TournamentModeOptionsHelp=Configurer les règles appliquées à toute la machine pendant un tournoi.
SelectMusicOptionsHelp=Régler le comportement et l'affichage de l'écran de choix de la musique.
AdvancedOptionsHelp=Régler le comportement d'échec et de cache/analyse au niveau de la machine.
CourseOptionsHelp=Régler les options liées au choix et au déroulement des parcours.
ManageLocalProfilesHelp=Créer, modifier et gérer les profils de joueurs enregistrés sur cet ordinateur.\n\nUn clavier est nécessaire pour utiliser cet écran.
OnlineScoreServicesHelp=Configurer les services de scores en ligne et les outils d'importation.
DownloadPacksHelp=Parcourir et installer des packs de chansons depuis StepManiaOnline. Recherchez parmi des milliers de packs de la communauté, consultez leur taille et leur contenu, et téléchargez-les directement dans votre dossier Songs.
NullOrDieOptionsHelp=Configurer l'analyse null-or-die et les outils de synchronisation en masse.
FoldersOptionsHelp=Indique où DeadSync enregistre vos données sur cet ordinateur. Chaque ligne ouvre le dossier dans l'explorateur de fichiers de votre système.
ReloadSongsCoursesHelp=Recharger toutes les chansons et tous les parcours depuis le disque sans redémarrer.
CheckForUpdatesHelp=Interroger GitHub immédiatement pour rechercher une version plus récente. Ouvre la fenêtre de mise à jour pour examiner et appliquer une éventuelle mise à jour.
RollBackVersionHelp=Revenir à une version antérieure. Récupère les dernières versions publiées sur GitHub et vous permet de choisir l'une des quelques versions précédant celle que vous utilisez, puis la télécharge et l'installe comme une mise à jour normale.
DownloadVideoSupportHelp=Télécharger les outils ffmpeg et ffprobe nécessaires aux arrière-plans vidéo en jeu. Récupérés depuis une compilation tierce de confiance et vérifiés avant l'installation.
CreditsHelp=Afficher les crédits de deadsync et du projet.
ExitHelp=Revenir au menu principal.
ExitSubHelp=Revenir à la liste principale des options.
ThemeHelp=Enregistré dans deadsync.ini pour compatibilité ; le changement de thème n'est pas encore implémenté.
LanguageHelp=S'applique immédiatement et est enregistré dans deadsync.ini.

